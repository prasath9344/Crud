name: Deploy PrepyAI-API Docker App to AWS EC2

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy (e.g., dev, prod)"
        required: false
        default: "dev"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: crud
  CONTAINER_NAME: crud-api
  INSTANCE_TYPE: t2.micro
  AMI_ID: ami-0bbdd8c17ed981ef9
  KEY_NAME: sample-project-ec2
  INSTANCE_NAME: crud-deployment
  SECURITY_GROUP_NAME: launch-wizard-8
  SECURITY_GROUP_DESCRIPTION: "launch-wizard-8 created via GitHub Actions"
  VPC_ID: vpc-0203ae7df1d2077e1
  ECR_ROLE_NAME: crud-api

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::934484537298:role/crud-api

      - name: Check/Create Security Group
        id: security-group
        run: |
          SECURITY_GROUP_ID=$(aws ec2 describe-security-groups \
            --filters Name=group-name,Values=${{ env.SECURITY_GROUP_NAME }} \
            --query 'SecurityGroups[0].GroupId' --output text)
          if [[ "$SECURITY_GROUP_ID" == "None" ]]; then
            SECURITY_GROUP_ID=$(aws ec2 create-security-group \
              --group-name ${{ env.SECURITY_GROUP_NAME }} \
              --description "${{ env.SECURITY_GROUP_DESCRIPTION }}" \
              --vpc-id ${{ env.VPC_ID }} --query 'GroupId' --output text)
          fi
          echo "SECURITY_GROUP_ID=$SECURITY_GROUP_ID" >> $GITHUB_ENV

      - name: Authorize Ingress
        run: |
          RULES='[
            {"IpProtocol":"tcp","FromPort":22,"ToPort":22,"CidrIp":"0.0.0.0/0"},
            {"IpProtocol":"tcp","FromPort":80,"ToPort":80,"CidrIp":"0.0.0.0/0"},
            {"IpProtocol":"tcp","FromPort":443,"ToPort":443,"CidrIp":"0.0.0.0/0"},
            {"IpProtocol":"tcp","FromPort":5000,"ToPort":5000,"CidrIp":"0.0.0.0/0"}
          ]'
          for RULE in $(echo "$RULES" | jq -c '.[]'); do
            PROTOCOL=$(echo "$RULE" | jq -r '.IpProtocol')
            FROM_PORT=$(echo "$RULE" | jq -r '.FromPort')
            TO_PORT=$(echo "$RULE" | jq -r '.ToPort')
            CIDR_IP=$(echo "$RULE" | jq -r '.CidrIp')
            EXISTING_RULE=$(aws ec2 describe-security-group-rules \
              --filters Name=group-id,Values=${{ env.SECURITY_GROUP_ID }} \
              --query "SecurityGroupRules[?FromPort==\`$FROM_PORT\` && ToPort==\`$TO_PORT\` && IpProtocol==\`$PROTOCOL\` && CidrIpv4==\`$CIDR_IP\`]" \
              --output text)
            if [[ -z "$EXISTING_RULE" ]]; then
              aws ec2 authorize-security-group-ingress \
                --group-id ${{ env.SECURITY_GROUP_ID }} \
                --protocol $PROTOCOL --port $FROM_PORT-$TO_PORT --cidr $CIDR_IP
            fi
          done

      - name: Check/Create EC2 Instance
        id: ec2-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ env.INSTANCE_NAME }}" \
            "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)
          if [[ "$INSTANCE_ID" == "None" ]]; then
            INSTANCE_ID=$(aws ec2 run-instances \
              --image-id ${{ env.AMI_ID }} --count 1 --instance-type ${{ env.INSTANCE_TYPE }} \
              --key-name ${{ env.KEY_NAME }} \
              --network-interfaces '[{"AssociatePublicIpAddress":true,"DeviceIndex":0,"Groups":["${{ env.SECURITY_GROUP_ID }}"]}]' \
              --iam-instance-profile Name=${{ env.ECR_ROLE_NAME }} \
              --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=${{ env.INSTANCE_NAME }} }]" \
              --query 'Instances[0].InstanceId' --output text)
          fi
          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV

      - name: Wait for EC2 Instance to be running
        run: aws ec2 wait instance-running --instance-ids ${{ env.INSTANCE_ID }}

      - name: Get EC2 Public IP
        id: get-public-ip
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids ${{ env.INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          echo "PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG} .
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}

      - name: Prepare SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Deploy Container to EC2
        env:
          PUBLIC_IP: ${{ env.PUBLIC_IP }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@${{ env.PUBLIC_IP }} << 'EOF'

            sudo apt-get update -y
            sudo apt-get install -y gnupg ca-certificates curl unzip lsb-release nginx certbot python3-certbot-nginx
            curl -fsSL https://get.docker.com -o get-docker.sh
            sudo sh get-docker.sh
            sudo usermod -aG docker ubuntu
            sudo systemctl enable docker --now

            aws ecr get-login-password --region ${{ env.AWS_REGION }} | sudo docker login --username AWS --password-stdin ${{ steps.ecr-login.outputs.registry }}

            sudo docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            echo "DB_USER=${{ secrets.DB_USER }}" | sudo tee /home/ubuntu/.env
            echo "DB_HOST=${{ secrets.DB_HOST }}" | sudo tee -a /home/ubuntu/.env
            echo "DB_NAME=${{ secrets.DB_NAME }}" | sudo tee -a /home/ubuntu/.env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" | sudo tee -a /home/ubuntu/.env

            sudo tee /etc/systemd/system/${{ env.CONTAINER_NAME }}.service > /dev/null <<SERVICE
      [Unit]
      Description=PrepyAI API Container
      After=network.target docker.service
      Requires=docker.service

      [Service]
      Restart=always
      ExecStartPre=-/usr/bin/docker stop ${{ env.CONTAINER_NAME }}
      ExecStartPre=-/usr/bin/docker rm ${{ env.CONTAINER_NAME }}
      ExecStart=/usr/bin/docker run --rm --name ${{ env.CONTAINER_NAME }} --env-file /home/ubuntu/.env -p 5000:5000 $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
      ExecStop=-/usr/bin/docker stop ${{ env.CONTAINER_NAME }}

      [Install]
      WantedBy=multi-user.target
      SERVICE

            sudo systemctl daemon-reload
            sudo systemctl enable ${{ env.CONTAINER_NAME }}
            sudo systemctl restart ${{ env.CONTAINER_NAME }}

            sudo bash -c "cat > /etc/nginx/sites-available/${{ env.CONTAINER_NAME }}" <<EOL
      server {
      listen 80;
      server_name praveen.me;
  
      location / {
        proxy_pass http://localhost:5000;
        proxy_set_header Host \$host;
        proxy_set_header X-Real-IP \$remote_addr;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto \$scheme;
      }
      }  
      EOL

            sudo rm -f /etc/nginx/sites-enabled/default
            sudo ln -sf /etc/nginx/sites-available/${{ env.CONTAINER_NAME }} /etc/nginx/sites-enabled/
            sudo nginx -t && sudo systemctl restart nginx

            sudo certbot --nginx -d praveen.me --non-interactive --agree-tos -m praveen.work.cyber@gmail.com
          EOF

